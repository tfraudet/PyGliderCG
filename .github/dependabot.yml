version: 2
updates:
  # 1. Gestion du projet à la racine
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly" # "daily", "weekly" ou "monthly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-patch-fixes:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 2. Gestion de l'application /web
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-patch-fixes:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"